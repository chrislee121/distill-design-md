<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coral Dashboard | Example</title>
  <meta name="theme-color" content="#E24A3A">
  <meta name="description" content="Warm coral product dashboard">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600">
  <style>
    :root {
      --primary: #E24A3A;
      --background: #F7F1EA;
      --surface: #FFFFFF;
      --font-sans: "Inter", sans-serif;
      --radius: 12px;
    }
    body { font-family: Inter, sans-serif; background: var(--background); color-scheme: light; }
    .btn { border-radius: 12px; background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <button class="btn">Save</button>
</body>
</html>
